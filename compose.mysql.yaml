# MySQL database for the 'mysql' Spring profile.
#   Start :  docker compose -f compose.mysql.yaml up -d
#   (podman: podman compose -f compose.mysql.yaml up -d)
#   Run app: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
services:
  mysql:
    image: 'mysql:8.4'
    container_name: spring-mysql
    environment:
      - 'MYSQL_DATABASE=mydatabase'
      - 'MYSQL_USER=myuser'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
    ports:
      - '3306:3306'
