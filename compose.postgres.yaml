# PostgreSQL database for the 'postgres' Spring profile.
#   Start :  docker compose -f compose.postgres.yaml up -d
#   (podman: podman compose -f compose.postgres.yaml up -d)
#   Run app: ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
services:
  postgres:
    image: 'postgres:16'
    container_name: spring-postgres
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_USER=myuser'
      - 'POSTGRES_PASSWORD=secret'
    ports:
      - '5432:5432'
