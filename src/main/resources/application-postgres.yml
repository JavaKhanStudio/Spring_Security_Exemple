# =====================================================================
#  Profil "postgres" : base PostgreSQL externe (voir compose.postgres.yaml).
#   1. docker compose -f compose.postgres.yaml up -d
#   2. ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
#  Fichier autonome (datasource, JWT, CORS) : fonctionne apres un git clone.
# =====================================================================

spring:
  datasource:
    url: "jdbc:postgresql://localhost:5432/mydatabase"
    driver-class-name: org.postgresql.Driver
    username: myuser
    password: secret
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    # Migrations ecrites pour PostgreSQL (voir db/postgres)
    locations: "classpath:db/postgres"

# Secret JWT de developpement uniquement (HS512 => 64 octets minimum). A CHANGER en production.
jwt:
  secret: "local-dev-only-change-me-0123456789-abcdefghijklmnopqrstuvwxyz-0123456789"

cors:
  allowedOrigins: "http://localhost:3000,http://localhost:8080"

server:
  port: 8080
