spring.application.name=website

# ---- Datasource (matches compose.yaml) ----
spring.datasource.url=jdbc:mysql://localhost:3306/mydatabase?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=myuser
spring.datasource.password=secret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate (schema managed by Flyway) ----
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration/testdata

# ---- JWT (HS512 requires >= 64 bytes) ----
jwt.secret=local-dev-only-change-me-0123456789-abcdefghijklmnopqrstuvwxyz-0123456789

# ---- CORS ----
cors.allowedOrigins=http://localhost:3000,http://localhost:8080

server.port=8080
