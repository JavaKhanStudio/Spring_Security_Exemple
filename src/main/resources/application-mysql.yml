# =====================================================================
#  Profil "mysql" : base MySQL externe (voir compose.mysql.yaml).
#   1. docker compose -f compose.mysql.yaml up -d
#   2. ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
#  Fichier autonome (datasource, JWT, CORS) : fonctionne apres un git clone.
# =====================================================================

spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/mydatabase?allowPublicKeyRetrieval=true&useSSL=false"
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: myuser
    password: secret
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    # Migrations MySQL + jeu de donnees de test (db/migration inclut testdata/)
    locations: "classpath:db/migration"

# Secret JWT de developpement uniquement (HS512 => 64 octets minimum). A CHANGER en production.
jwt:
  secret: "local-dev-only-change-me-0123456789-abcdefghijklmnopqrstuvwxyz-0123456789"

cors:
  allowedOrigins: "http://localhost:3000,http://localhost:8080"

server:
  port: 8080
